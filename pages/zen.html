    <!-- Chromes discrets -->
    <div class="zen-chrome">
        <a class="zen-pill" href="../index.html">← Quitter le mode zen</a>
        <button class="zen-pill" id="zen-mute" aria-pressed="false">🔊 Ambiance sonore</button>
    </div>

    <p class="zen-caption">Mode zen — respirez au rythme des vagues</p>

    <!-- Sas d'entrée : débloque l'audio (geste utilisateur requis) -->
    <div class="zen-enter" id="zen-enter">
        <div class="glass-panel zen-enter-card">
            <span class="hero-badge">🌊 Mode zen</span>
            <h1>Plongez en eaux calmes</h1>
            <p class="lead">Lumières bleues, dauphin lointain, vagues et sifflements générés en direct. Mettez un casque, respirez…</p>
            <button class="btn btn-primary" id="zen-enter-btn">Entrer dans la bulle</button>
        </div>
    </div>
